<script type="text/javascript">
RED.nodes.registerType('saia-config', {
    category: 'config',
    label: function () { return this.name || 'SAIA ' + this.host + ':' + this.port + ' (S' + this.station + ')'; },
    defaults: {
        name:    { value: '' },
        host:    { value: '192.168.1.100', required: true },
        port:    { value: 5050, required: true, validate: RED.validators.number() },
        station: { value: 1,   required: true, validate: RED.validators.number() },
        timeout: { value: 2000,required: true, validate: RED.validators.number() }
    }
});
</script>
<script type="text/html" data-template-name="saia-config">
  <div class="form-row">
    <label for="node-config-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-config-input-name" placeholder="SAIA PCD">
  </div>
  <div class="form-row">
    <label for="node-config-input-host"><i class="fa fa-server"></i> Host / IP</label>
    <input type="text" id="node-config-input-host" placeholder="192.168.1.100">
  </div>
  <div class="form-row">
    <label for="node-config-input-port"><i class="fa fa-plug"></i> UDP Port</label>
    <input type="number" id="node-config-input-port" placeholder="5050">
  </div>
  <div class="form-row">
    <label for="node-config-input-station"><i class="fa fa-hashtag"></i> Station</label>
    <input type="number" id="node-config-input-station" placeholder="1">
  </div>
  <div class="form-row">
    <label for="node-config-input-timeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
    <input type="number" id="node-config-input-timeout" placeholder="2000">
  </div>
</script>
